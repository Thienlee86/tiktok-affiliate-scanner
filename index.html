<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>TikTok Affiliate Scanner</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f4f6f8;color:#17202a}.wrap{max-width:760px;margin:auto;padding:18px}h1{font-size:24px;margin:8px 0}.sub{color:#667085;margin:0 0 16px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0001}label{font-size:13px;color:#667085;display:block;margin-top:10px}input{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:12px;font-size:16px;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px}.primary{background:#fe2c55;color:white;width:100%;margin-top:14px}.ghost{background:#eef2f6}.score{font-size:32px;font-weight:800}.pill{display:inline-block;padding:5px 9px;background:#eef2ff;border-radius:999px;font-size:12px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.small{font-size:12px;color:#667085}.warn{background:#fff7ed;padding:10px;border-radius:10px;font-size:13px}.top{border:2px solid #fe2c55}a{color:#0b57d0}.actions{display:flex;gap:8px}.actions button{flex:1}</style></head>
<body><main class="wrap"><h1>Affiliate Scanner V1</h1><p class="sub">Chấm điểm sản phẩm TikTok Shop trên điện thoại • dữ liệu lưu ngay trên máy.</p>
<section class="card"><b>Thêm sản phẩm</b><label>Tên sản phẩm</label><input id="name" placeholder="VD: Tã quần Bobby Premium Soft"><div class="grid"><div><label>Giá (đ)</label><input id="price" inputmode="numeric"></div><div><label>Hoa hồng (đ)</label><input id="commission" inputmode="numeric"></div><div><label>Đã bán 7 ngày</label><input id="sold" inputmode="numeric" placeholder="nếu có"></div><div><label>Rating (0–5)</label><input id="rating" inputmode="decimal" placeholder="nếu có"></div></div><label>Link affiliate</label><input id="link" placeholder="https://vt.tiktok.com/..."><button class="primary" onclick="add()">+ Lưu & chấm điểm</button></section>
<div class="warn">Score V1 là công cụ sàng lọc, không phải cam kết có đơn. Thiếu doanh số/rating sẽ được đánh dấu thay vì tự đoán.</div>
<section id="list"></section></main><script>
const K='tt_aff_v1'; let items=JSON.parse(localStorage.getItem(K)||'[]');
const n=v=>Number(String(v||'').replace(/[^0-9.]/g,''))||0;
function calc(x){let rate=x.price?x.commission/x.price*100:0;let c=Math.min(rate/20,1)*25;let cash=Math.min(x.commission/30000,1)*20;let sales=x.sold?Math.min(Math.log10(x.sold+1)/5,1)*35:0;let rating=x.rating?Math.min(x.rating/5,1)*20:0;let known=(x.sold?35:0)+(x.rating?20:0);let score=(c+cash+sales+rating)/(45+known)*100;return {rate,score:Math.round(score)}}
function add(){let x={id:Date.now(),name:name.value.trim(),price:n(price.value),commission:n(commission.value),sold:n(sold.value),rating:Number(rating.value)||0,link:link.value.trim()};if(!x.name||!x.price||!x.commission)return alert('Nhập tên, giá và hoa hồng trước nhé.');items.push(x);save();['name','price','commission','sold','rating','link'].forEach(i=>document.getElementById(i).value='')}
function save(){localStorage.setItem(K,JSON.stringify(items));render()}
function del(id){items=items.filter(x=>x.id!==id);save()}
function render(){let a=[...items].sort((x,y)=>calc(y).score-calc(x).score);list.innerHTML=a.map((x,i)=>{let z=calc(x);return `<article class="card ${i===0?'top':''}"><div class="row"><div><span class="pill">${i===0?'TOP hiện tại':'#'+(i+1)}</span><h3>${x.name}</h3></div><div class="score">${z.score}</div></div><div class="grid"><div>Giá<br><b>${x.price.toLocaleString('vi-VN')}đ</b></div><div>Hoa hồng<br><b>${x.commission.toLocaleString('vi-VN')}đ</b></div><div>% hoa hồng<br><b>${z.rate.toFixed(1)}%</b></div><div>Dữ liệu<br><b>${x.sold?x.sold.toLocaleString('vi-VN')+' bán':'? bán'} • ${x.rating?x.rating+'★':'? rating'}</b></div></div><p class="small">${(!x.sold||!x.rating)?'⚠ Chưa đủ dữ liệu để xếp hạng cuối cùng.':'✓ Có đủ dữ liệu cơ bản.'}</p><div class="actions">${x.link?`<button class="ghost" onclick="location.href='${x.link}'">Mở link</button>`:''}<button class="ghost" onclick="del(${x.id})">Xóa</button></div></article>`}).join('')||'<div class="card small">Chưa có sản phẩm. Nhập Bobby để thử bản V1.</div>'}
render(); if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
